name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Download offline speech model (Vosk, English small)
        run: |
          curl -sSL -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q model.zip
          mkdir -p app/src/main/assets/model
          cp -r vosk-model-small-en-us-0.15/* app/src/main/assets/model/
          rm -rf model.zip vosk-model-small-en-us-0.15

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk StraikCam-0.1.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StraikCam-apk
          path: StraikCam-*.apk

      - name: Publish as release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Straik Cam 0.1.${{ github.run_number }}
          prerelease: true
          files: StraikCam-*.apk
